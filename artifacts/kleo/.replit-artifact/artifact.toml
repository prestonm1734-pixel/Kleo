kind = "web"
previewPath = "/"
title = "Kleo — AI Personal Wealth Management"
version = "1.0.0"
id = "artifacts/kleo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25553

[services.development]
run = "pnpm --filter @workspace/kleo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kleo", "run", "build" ]
publicDir = "artifacts/kleo/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25553"
BASE_PATH = "/"
